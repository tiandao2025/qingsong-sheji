<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ========================================
   青松设计 · 方案汇报详情页
   Modern Minimalist Proposal Detail
   ======================================== */

/* ===== CSS Variables ===== */
:root {
  --color-bg: #FAFAF8;
  --color-bg-alt: #F2F0EC;
  --color-text: #1A1A1A;
  --color-text-secondary: #6B6B6B;
  --color-text-light: #999999;
  --color-accent: #B8916A;
  --color-accent-light: #D4B896;
  --color-line: #E5E2DC;
  --color-white: #FFFFFF;

  --font-serif: 'Noto Serif SC', 'Songti SC', serif;
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  --max-width: 1400px;
}

/* ===== Reset ===== */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:16px; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img { display:block; max-width:100%; height:auto; }
a { color:inherit; text-decoration:none; }

/* ===== Loading Screen ===== */
#loader {
  position:fixed; inset:0; background:var(--color-bg); z-index:9999;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:24px;
  transition: opacity 0.8s var(--ease-out), visibility 0.8s var(--ease-out);
}
#loader.hidden { opacity:0; visibility:hidden; }
.loader-text {
  font-family:var(--font-serif); font-size:1.5rem; letter-spacing:0.3em;
  color:var(--color-text); opacity:0;
  animation: fadeInUp 1s var(--ease-out) 0.2s forwards;
}
.loader-bar { width:120px; height:1px; background:var(--color-line); position:relative; overflow:hidden; }
.loader-bar::after {
  content:''; position:absolute; left:0; top:0; height:100%; width:100%;
  background:var(--color-accent); transform:translateX(-100%);
  animation: loaderSlide 1.5s var(--ease-in-out) infinite;
}
@keyframes loaderSlide { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

/* ===== Navigation ===== */
.nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:20px 48px; display:flex; align-items:center; justify-content:space-between;
  transition: all 0.4s var(--ease-out);
  background: rgba(250,250,248,0);
  backdrop-filter: blur(0px);
}
.nav.scrolled {
  padding:14px 48px;
  background: rgba(250,250,248,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--color-line);
}
.nav-inner {
  width:100%; max-width:var(--max-width); margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
}
.nav-logo {
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-serif); font-size:1.25rem; font-weight:500;
  letter-spacing:0.1em; color:var(--color-text); transition:color 0.3s ease;
}
.nav-logo img { width:32px; height:32px; border-radius:50%; border:2px solid var(--color-accent); object-fit:cover; }
.nav-logo span { color:var(--color-accent); }
.nav-links { display:flex; gap:36px; list-style:none; align-items:center; }
.nav-links a {
  font-size:0.875rem; color:var(--color-text-secondary); letter-spacing:0.05em;
  position:relative; transition:color 0.3s ease; padding-bottom:4px;
}
.nav-links a::after {
  content:''; position:absolute; bottom:0; left:0; width:0; height:1px;
  background:var(--color-accent); transition:width 0.3s var(--ease-out);
}
.nav-links a:hover, .nav-links a.active { color:var(--color-text); }
.nav-links a:hover::after, .nav-links a.active::after { width:100%; }
.nav-toggle { display:none; flex-direction:column; gap:5px; cursor:pointer; z-index:101; }
.nav-toggle span { width:24px; height:1.5px; background:var(--color-text); transition:all 0.3s ease; }

/* ===== Back Link ===== */
.back-link {
  position:fixed; left:48px; top:50%; transform:translateY(-50%); z-index:99;
  opacity:0; visibility:hidden; transition:all 0.4s var(--ease-out);
}
.back-link.show { opacity:1; visibility:visible; }
.back-link a {
  font-size:0.8125rem; color:var(--color-text-secondary); letter-spacing:0.05em;
  display:flex; align-items:center; gap:8px; transition:color 0.3s ease;
}
.back-link a:hover { color:var(--color-accent); }

/* ===== Hero ===== */
.hero {
  position:relative; height:100vh; min-height:640px; overflow:hidden;
  display:flex; align-items:flex-end;
}
.hero-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.28) 45%, rgba(0,0,0,0.15) 100%);
}
.hero-content {
  position:relative; z-index:2; width:100%; max-width:var(--max-width);
  margin:0 auto; padding:0 48px 96px;
  opacity:0; transform:translateY(28px);
  animation: heroIn 1.1s var(--ease-out) 0.35s forwards;
}
@keyframes heroIn { to { opacity:1; transform:translateY(0); } }
.hero-tag {
  display:inline-block; font-size:0.75rem; letter-spacing:0.28em; text-transform:uppercase;
  color:var(--color-accent-light); margin-bottom:18px;
}
.hero-title {
  font-family:var(--font-serif); font-size:clamp(2rem, 4.4vw, 3.5rem);
  font-weight:500; letter-spacing:0.06em; color:#fff; line-height:1.25; margin-bottom:18px;
}
.hero-subtitle { font-size:1.0625rem; color:rgba(255,255,255,0.82); max-width:720px; line-height:1.8; font-weight:300; }
.hero-meta { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
.hero-meta .meta-chip {
  font-size:0.8125rem; color:rgba(255,255,255,0.9); letter-spacing:0.06em;
  border:1px solid rgba(255,255,255,0.32); border-radius:999px; padding:6px 16px;
}
.hero-scroll {
  position:absolute; right:48px; bottom:48px; z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  font-size:0.6875rem; letter-spacing:0.28em; color:rgba(255,255,255,0.7);
}
.hero-scroll-line { width:1px; height:56px; background:rgba(255,255,255,0.35); position:relative; overflow:hidden; }
.hero-scroll-line::after {
  content:''; position:absolute; left:0; top:0; width:100%; height:40%;
  background:#fff; animation: scrollLine 2s var(--ease-in-out) infinite;
}
@keyframes scrollLine { 0% { transform:translateY(-100%); } 100% { transform:translateY(250%); } }

/* ===== Sections ===== */
.section { padding:88px 0; }
.section-inner { max-width:1100px; margin:0 auto; padding:0 48px; }
.section-header { text-align:center; margin-bottom:56px; }
.section-header h2 {
  font-family:var(--font-serif); font-size:1.75rem; font-weight:500; letter-spacing:0.12em;
}
.section-header .line { width:48px; height:1px; background:var(--color-accent); margin:18px auto 0; }

/* ===== Info Cards ===== */
.info-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:20px; }
.info-card {
  background:var(--color-white); border:1px solid var(--color-line); border-radius:12px;
  padding:24px 26px; transition:transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
}
.info-card:hover { transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.06); }
.info-card-label {
  font-size:0.75rem; letter-spacing:0.2em; color:var(--color-text-light);
  text-transform:uppercase; margin-bottom:10px;
}
.info-card-value { font-family:var(--font-serif); font-size:1.0625rem; color:var(--color-text); }

.tag-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; justify-content:center; }
.tag-list .tag {
  font-size:0.75rem; padding:5px 14px; background:rgba(184,145,106,0.1);
  color:var(--color-accent); border-radius:999px; letter-spacing:0.05em;
}

/* ===== Rich Content ===== */
.content-body {
  max-width:860px; margin:0 auto; font-size:1rem; line-height:2;
  color:#333; font-weight:300;
}
.content-body p { margin-bottom:18px; }
.content-body h2 {
  font-family:var(--font-serif); font-size:1.375rem; font-weight:500;
  margin:40px 0 18px; letter-spacing:0.08em; color:var(--color-text);
}
.content-body h3 {
  font-family:var(--font-serif); font-size:1.1875rem; font-weight:500;
  margin:32px 0 16px; letter-spacing:0.06em; color:var(--color-text);
}
.content-body h4 { font-size:1.0625rem; font-weight:500; margin:26px 0 14px; color:var(--color-text); }
.content-body img { border-radius:12px; margin:24px 0; }
.content-body ul, .content-body ol { margin:0 0 18px 22px; }
.content-body li { margin-bottom:8px; }
.content-body a { color:var(--color-accent); border-bottom:1px solid var(--color-accent-light); }
.content-body strong { font-weight:500; color:var(--color-text); }

/* ===== Gallery ===== */
.gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }
.gallery-item {
  position:relative; overflow:hidden; border-radius:12px; cursor:zoom-in;
  background:var(--color-bg-alt); aspect-ratio:4 / 3;
}
.gallery-item img { width:100%; height:100%; object-fit:cover; transition:transform 0.6s var(--ease-out); }
.gallery-item:hover img { transform:scale(1.05); }

/* Lightbox */
.lightbox {
  position:fixed; inset:0; z-index:9998; background:rgba(0,0,0,0.9);
  display:none; align-items:center; justify-content:center; padding:40px;
}
.lightbox.show { display:flex; }
.lightbox img { max-width:100%; max-height:100%; border-radius:8px; }
.lightbox-close {
  position:absolute; top:24px; right:32px; width:44px; height:44px; border-radius:50%;
  background:rgba(255,255,255,0.14); color:#fff; border:none; font-size:22px; cursor:pointer;
}

/* ===== Video ===== */
.video-wrapper {
  position:relative; padding-bottom:56.25%; height:0; overflow:hidden;
  border-radius:12px; background:#000;
}
.video-wrapper iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }

/* ===== Attachment ===== */
.file-download {
  display:inline-flex; align-items:center; gap:10px; padding:16px 28px;
  background:var(--color-white); border:1px solid var(--color-line); border-radius:999px;
  font-size:0.9375rem; color:var(--color-text); transition:all 0.3s var(--ease-out);
}
.file-download:hover { border-color:var(--color-accent); color:var(--color-accent); transform:translateY(-2px); }

/* ===== Lock (加密方案) ===== */
.lock-box {
  background:var(--color-white); border:1px solid var(--color-line); border-radius:16px;
  padding:48px 36px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.05);
}
.lock-icon { font-size:26px; margin-bottom:16px; }
.lock-title { font-family:var(--font-serif); font-size:1.5rem; font-weight:500; letter-spacing:0.06em; }
.lock-line { width:36px; height:1px; background:var(--color-accent); margin:20px auto; }
.lock-desc { font-size:0.9rem; color:var(--color-text-secondary); line-height:1.9; }
#lockForm { margin-top:26px; }
#lockPassword {
  width:100%; height:48px; border:1px solid var(--color-line); border-radius:10px;
  padding:0 16px; font-size:1rem; font-family:inherit; outline:none; background:var(--color-bg);
  color:var(--color-text); transition:border-color 0.3s ease; text-align:center; letter-spacing:0.1em;
}
#lockPassword:focus { border-color:var(--color-accent); }
#lockBtn {
  width:100%; height:48px; margin-top:14px; border:none; border-radius:10px;
  background:var(--color-accent); color:#fff; font-size:1rem; font-family:inherit;
  letter-spacing:0.16em; cursor:pointer; transition:background 0.3s ease;
}
#lockBtn:hover { background:#A67F58; }
#lockBtn:disabled { opacity:0.6; cursor:default; }
.lock-error { color:#d9534f; font-size:0.8125rem; margin-top:12px; min-height:18px; }
.lock-back { display:inline-block; margin-top:20px; font-size:0.8125rem; color:var(--color-text-light); transition:color 0.3s ease; }
.lock-back:hover { color:var(--color-accent); }

/* ===== Error ===== */
.error-state { text-align:center; padding:180px 24px 120px; }
.error-state p { color:var(--color-text-secondary); margin-bottom:16px; }
.error-state a { color:var(--color-accent); }

/* ===== Footer ===== */
.footer { background:var(--color-bg-alt); border-top:1px solid var(--color-line); padding:64px 48px 32px; }
.footer-inner { max-width:var(--max-width); margin:0 auto; display:grid; grid-template-columns:2fr 1fr 1fr; gap:40px; }
.footer-brand h3 { font-family:var(--font-serif); font-size:1.25rem; font-weight:500; letter-spacing:0.12em; margin-bottom:16px; }
.footer-brand p { font-size:0.875rem; color:var(--color-text-secondary); line-height:1.9; max-width:460px; }
.footer-col h4 { font-size:0.8125rem; letter-spacing:0.18em; color:var(--color-text); margin-bottom:16px; font-weight:500; }
.footer-col p { font-size:0.875rem; color:var(--color-text-secondary); line-height:1.9; }
.footer-bottom {
  max-width:var(--max-width); margin:48px auto 0; padding-top:24px; border-top:1px solid var(--color-line);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  font-size:0.8125rem; color:var(--color-text-light);
}

@media (max-width: 900px) {
  .nav { padding:16px 24px; }
  .nav.scrolled { padding:12px 24px; }
  .nav-links { display:none; }
  .nav-toggle { display:flex; }
  .back-link { display:none; }
  .hero-content { padding:0 24px 72px; }
  .hero-scroll { right:24px; bottom:28px; }
  .section { padding:64px 0; }
  .section-inner { padding:0 24px; }
  .footer { padding:48px 24px 28px; }
  .footer-inner { grid-template-columns:1fr; gap:32px; }
  .gallery-grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
}
</style>

<script>
(function () {
  'use strict';

  var proposalData = null;
  var bilibiliEmbedUrl = null;
  var imageList = [];

  var id = new URLSearchParams(window.location.search).get('id');
  if (!id) {
    document.getElementById('hero').innerHTML = '<div class="error-state"><p>缺少方案汇报 ID</p><a href="proposals.html">&larr; 返回方案汇报列表</a></div>';
    hideLoader();
  } else {
    loadProposal(id);
  }

  function escapeHtml(str) {
    return String(str === undefined || str === null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function parseBilibiliUrl(url) {
    if (!url) return null;
    var match = url.match(/BV[a-zA-Z0-9]+/);
    if (match) return 'https://player.bilibili.com/player.html?bvid=' + match[0] + '&page=1&high_quality=1&autoplay=0';
    match = url.match(/av(\d+)/);
    if (match) return 'https://player.bilibili.com/player.html?aid=' + match[1] + '&page=1&high_quality=1&autoplay=0';
    return null;
  }

  function formatDate(str) {
    if (!str) return '';
    var d = new Date(str);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  // 与案例详情页保持一致的轻量 Markdown 渲染
  function formatContent(text) {
    if (!text) return '';
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/^### (.+)$/gm, '<h4>$1</h4>')
      .replace(/^## (.+)$/gm, '<h3>$1</h3>')
      .replace(/^# (.+)$/gm, '<h2>$1</h2>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^(.+)$/gm, function (m) { return m.startsWith('<') ? m : '<p>' + m + '</p>'; });
  }

  async function loadProposal(proposalId) {
    try {
      var res = await fetch('/api/proposals?id=' + encodeURIComponent(proposalId));
      if (!res.ok) throw new Error('加载失败');
      var payload = await res.json();
      proposalData = payload.item || payload;
      if (!proposalData || !proposalData.id) throw new Error('数据异常');

      document.title = proposalData.title + ' - 青松设计';

      // 加密方案：未解锁时只显示密码输入框
      if (payload.locked) {
        renderLock();
        updateFooter();
        hideLoader();
        return;
      }

      // 网页文件夹型方案：直接跳转到上传的在线页面
      if (proposalData.has_page && proposalData.page_url) {
        window.location.replace(proposalData.page_url);
        return;
      }

      bilibiliEmbedUrl = parseBilibiliUrl(proposalData.video_url);
      if (Array.isArray(proposalData.images)) {
        imageList = proposalData.images.filter(function (u) { return String(u || '').trim(); });
      } else if (typeof proposalData.images === 'string' && proposalData.images.trim()) {
        imageList = proposalData.images.split(',').filter(function (u) { return u.trim(); });
      }

      renderHero();
      renderOverview();
      renderContent();
      renderGallery();
      renderVideo();
      renderFile();
      updateFooter();
      hideLoader();
    } catch (e) {
      document.getElementById('hero').innerHTML = '<div class="error-state"><p>加载失败，请返回列表重试</p><a href="proposals.html">&larr; 返回方案汇报列表</a></div>';
      hideLoader();
    }
  }

  function hideLoader() {
    var loader = document.getElementById('loader');
    if (loader) setTimeout(function () { loader.classList.add('hidden'); }, 600);
  }

  /* ===== Lock ===== */
  function renderLock() {
    var hero = document.getElementById('hero');
    if (hero) hero.style.display = 'none';

    var section = document.getElementById('lockSection');
    section.innerHTML =
      '<div class="section-inner" style="max-width:440px;">' +
        '<div class="lock-box">' +
          '<div class="lock-icon">&#128274;</div>' +
          '<h2 class="lock-title">' + escapeHtml(proposalData.title || '方案汇报') + '</h2>' +
          '<div class="lock-line"></div>' +
          '<p class="lock-desc">该方案汇报已加密<br>请输入访问密码查看完整内容</p>' +
          '<form id="lockForm">' +
            '<input type="password" id="lockPassword" placeholder="请输入访问密码" autocomplete="current-password" required>' +
            '<button type="submit" id="lockBtn">进 入</button>' +
          '</form>' +
          '<div class="lock-error" id="lockError"></div>' +
          '<a class="lock-back" href="proposals.html">&larr; 返回方案汇报列表</a>' +
        '</div>' +
      '</div>';
    section.style.display = 'block';

    var form = document.getElementById('lockForm');
    var input = document.getElementById('lockPassword');
    var btn = document.getElementById('lockBtn');
    var err = document.getElementById('lockError');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var pwd = input.value;
      if (!pwd) { err.textContent = '请输入访问密码'; return; }
      btn.disabled = true;
      btn.textContent = '验证中...';
      err.textContent = '';
      try {
        var res = await fetch('/api/proposals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: proposalData.id, password: pwd })
        });
        if (res.ok) {
          err.textContent = '验证通过，正在进入...';
          window.location.reload();
          return;
        }
        var data = await res.json().catch(function () { return {}; });
        err.textContent = data.error || '密码不正确，请重新输入';
      } catch (ex) {
        err.textContent = '网络异常，请稍后重试';
      }
      btn.disabled = false;
      btn.textContent = '进 入';
      input.focus();
      input.select();
    });

    setTimeout(function () { input.focus(); }, 300);
  }

  /* ===== Hero ===== */
  function renderHero() {
    var hero = document.getElementById('hero');
    var tags = proposalData.tags ? String(proposalData.tags).split(',').filter(function (t) { return t.trim(); }) : [];

    if (!proposalData.cover_image) {
      hero.innerHTML =
        '<div class="hero-content" style="padding-bottom:64px;">' +
          '<span class="hero-tag">Proposal</span>' +
          '<h1 class="hero-title" style="color:var(--color-text);">' + escapeHtml(proposalData.title) + '</h1>' +
          (proposalData.description ? '<p class="hero-subtitle" style="color:var(--color-text-secondary);">' + escapeHtml(proposalData.description) + '</p>' : '') +
        '</div>';
      hero.style.height = 'auto';
      hero.style.minHeight = '420px';
      hero.style.paddingTop = '180px';
      hero.style.alignItems = 'flex-start';
      return;
    }

    var chips = '';
    if (proposalData.category) chips += '<span class="meta-chip">' + escapeHtml(proposalData.category) + '</span>';
    if (proposalData.created_at) chips += '<span class="meta-chip">' + formatDate(proposalData.created_at) + '</span>';
    tags.slice(0, 3).forEach(function (t) { chips += '<span class="meta-chip">' + escapeHtml(t.trim()) + '</span>'; });

    hero.innerHTML =
      '<img class="hero-image" src="' + escapeHtml(proposalData.cover_image) + '" alt="' + escapeHtml(proposalData.title) + '" onerror="this.style.display=\'none\'">' +
      '<div class="hero-overlay"></div>' +
      '<div class="hero-content">' +
        '<span class="hero-tag">Proposal</span>' +
        '<h1 class="hero-title">' + escapeHtml(proposalData.title) + '</h1>' +
        (proposalData.description ? '<p class="hero-subtitle">' + escapeHtml(proposalData.description) + '</p>' : '') +
        (chips ? '<div class="hero-meta">' + chips + '</div>' : '') +
      '</div>' +
      '<div class="hero-scroll"><span>SCROLL</span><div class="hero-scroll-line"></div></div>';
  }

  /* ===== Overview ===== */
  function renderOverview() {
    var section = document.getElementById('overview');
    var tags = proposalData.tags ? String(proposalData.tags).split(',').filter(function (t) { return t.trim(); }) : [];

    var items = [];
    if (proposalData.category) items.push({ label: 'Proposal Type', value: proposalData.category });
    if (proposalData.created_at) items.push({ label: 'Date', value: formatDate(proposalData.created_at) });
    if (imageList.length > 0) items.push({ label: 'Images', value: imageList.length + ' 张' });
    if (proposalData.updated_at && proposalData.updated_at !== proposalData.created_at) {
      items.push({ label: 'Updated', value: formatDate(proposalData.updated_at) });
    }

    if (items.length === 0 && tags.length === 0) { section.style.display = 'none'; return; }

    var html = '';
    if (items.length > 0) {
      html += '<div class="info-grid">' + items.map(function (it) {
        return '<div class="info-card"><div class="info-card-label">' + it.label + '</div><div class="info-card-value">' + escapeHtml(it.value) + '</div></div>';
      }).join('') + '</div>';
    }
    if (tags.length > 0) {
      html += '<div class="tag-list">' + tags.map(function (t) { return '<span class="tag">' + escapeHtml(t.trim()) + '</span>'; }).join('') + '</div>';
    }

    section.innerHTML = '<div class="section-inner">' + html + '</div>';
    section.style.display = 'block';
  }

  /* ===== Content ===== */
  function renderContent() {
    var section = document.getElementById('contentSection');
    if (!proposalData.content || !proposalData.content.trim()) { section.style.display = 'none'; return; }

    section.innerHTML =
      '<div class="section-inner">' +
        '<div class="section-header"><h2>方案说明</h2><div class="line"></div></div>' +
        '<div class="content-body">' + formatContent(proposalData.content) + '</div>' +
      '</div>';
    section.style.display = 'block';
  }

  /* ===== Gallery ===== */
  function renderGallery() {
    var section = document.getElementById('gallerySection');
    var cover = proposalData.cover_image || '';
    var list = imageList.filter(function (u) { return u !== cover; });
    if (list.length === 0) { section.style.display = 'none'; return; }

    section.innerHTML =
      '<div class="section-inner">' +
        '<div class="section-header"><h2>方案图集</h2><div class="line"></div></div>' +
        '<div class="gallery-grid">' + list.map(function (u, i) {
          return '<div class="gallery-item" data-index="' + i + '"><img src="' + escapeHtml(u) + '" alt="方案图 ' + (i + 1) + '" loading="lazy"></div>';
        }).join('') + '</div>' +
      '</div>';
    section.style.display = 'block';

    section.querySelectorAll('.gallery-item').forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-index'), 10);
        openLightbox(list[idx]);
      });
    });
  }

  /* ===== Video ===== */
  function renderVideo() {
    var section = document.getElementById('videoSection');
    if (!bilibiliEmbedUrl) { section.style.display = 'none'; return; }

    section.innerHTML =
      '<div class="section-inner">' +
        '<div class="section-header"><h2>方案讲解</h2><div class="line"></div></div>' +
        '<div class="video-wrapper"><iframe src="' + bilibiliEmbedUrl + '" scrolling="no" frameborder="no" allowfullscreen="true"></iframe></div>' +
      '</div>';
    section.style.display = 'block';
  }

  /* ===== Attachment ===== */
  function renderFile() {
    var section = document.getElementById('fileSection');
    if (!proposalData.file_url) { section.style.display = 'none'; return; }

    var name = proposalData.file_name || '下载方案附件';
    section.innerHTML =
      '<div class="section-inner">' +
        '<a class="file-download" href="' + escapeHtml(proposalData.file_url) + '" target="_blank" rel="noopener">' +
          '<span>&#8681;</span><span>' + escapeHtml(name) + '</span>' +
        '</a>' +
      '</div>';
    section.style.display = 'block';
  }

  function updateFooter() {
    var el = document.getElementById('footerProposalInfo');
    if (!el || !proposalData) return;
    var parts = [];
    if (proposalData.category) parts.push(proposalData.category);
    if (proposalData.created_at) parts.push(formatDate(proposalData.created_at));
    el.innerHTML = escapeHtml(proposalData.title) + (parts.length ? '<br>' + escapeHtml(parts.join(' · ')) : '');
  }

  /* ===== Lightbox ===== */
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('show');
  }
  document.getElementById('lightboxClose').addEventListener('click', function () {
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  });
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) {
      lightbox.classList.remove('show');
      lightboxImg.src = '';
    }
  });

  /* ===== Nav / Scroll ===== */
  var nav = document.querySelector('.nav');
  var backLink = document.querySelector('.back-link');

  window.addEventListener('scroll', function () {
    var y = window.scrollY;
    if (y > 60) nav.classList.add('scrolled'); else nav.classList.remove('scrolled');
    if (backLink) {
      if (y > 60) backLink.classList.add('show'); else backLink.classList.remove('show');
    }
  }, { passive: true });

  var navToggle = document.querySelector('.nav-toggle');
  var navLinks = document.querySelector('.nav-links');
  if (navToggle && navLinks) {
    navToggle.addEventListener('click', function () {
      var isOpen = navLinks.style.display === 'flex';
      navLinks.style.display = isOpen ? 'none' : 'flex';
      if (!isOpen) {
        navLinks.style.position = 'absolute';
        navLinks.style.top = '72px';
        navLinks.style.left = '24px';
        navLinks.style.right = '24px';
        navLinks.style.flexDirection = 'column';
        navLinks.style.gap = '14px';
        navLinks.style.background = 'rgba(250,250,248,0.98)';
        navLinks.style.padding = '20px';
        navLinks.style.borderRadius = '12px';
        navLinks.style.boxShadow = '0 12px 30px rgba(0,0,0,0.08)';
      }
    });
  }
})();
</script>
</body>
</html>
