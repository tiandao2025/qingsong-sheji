<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计案例 | 青松设计</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #1D1D1F; background: #FFFFFF; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Navbar */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.95); border-bottom: 1px solid rgba(0,0,0,0.06); }
.nav-inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px; }
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #C9A96E; object-fit: cover; }
.nav-logo span { font-size: 16px; font-weight: 600; color: #1D1D1F; }
.nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
.nav-links a { text-decoration: none; color: #555; font-size: 13px; padding: 6px 14px; border-radius: 20px; transition: background 0.2s ease, color 0.2s ease; }
.nav-links a:hover, .nav-links a.active { background: #F5F5F7; color: #1D1D1F; }
.nav-links a.primary-link { background: #C9A96E; color: #fff; font-weight: 500; }
.nav-links a.primary-link:hover { background: #B8995E; }
.nav-back { color: #C9A96E !important; font-weight: 500; }

/* Page Header */
.page-header { padding-top: 100px; padding-bottom: 48px; text-align: center; }
.page-header h1 { font-size: 40px; font-weight: 700; letter-spacing: 2px; }
.page-header .line { width: 50px; height: 3px; background: #C9A96E; margin: 16px auto 0; }
.page-header p { color: #666; margin-top: 12px; font-size: 15px; }

/* Cases Grid */
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.case-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding-bottom: 80px; }

.case-card {
  background: #fff; border-radius: 12px; overflow: hidden;
  border: 1px solid #f0f0f0; cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.case-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }

.case-card-img { position: relative; width: 100%; height: 220px; overflow: hidden; background: #f5f5f5; }
.case-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.case-card:hover .case-card-img img { transform: scale(1.05); }
.case-card-badges { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.case-card-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.badge-video { background: #ff6b6b; color: #fff; }
.badge-file { background: #4a90d9; color: #fff; }

.case-card-body { padding: 20px; }
.case-card-body h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
.case-card-body p { font-size: 13px; color: #888; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.case-card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.case-card-tags .tag { font-size: 11px; padding: 3px 10px; background: #f5f0e5; color: #C9A96E; border-radius: 12px; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; overflow-y: auto; padding: 40px 0; }
.modal-overlay.show { display: block; }
.modal { background: #fff; border-radius: 16px; width: 90%; max-width: 800px; margin: 0 auto; overflow: hidden; }
.modal-close { position: sticky; top: 0; float: right; z-index: 10; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 20px; cursor: pointer; margin: 16px 16px 0 0; display: flex; align-items: center; justify-content: center; }
.modal-cover { width: 100%; max-height: 400px; object-fit: cover; }
.modal-body { padding: 32px; }
.modal-body h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.modal-body .modal-desc { color: #888; font-size: 14px; margin-bottom: 20px; }
.modal-body .modal-content { font-size: 15px; line-height: 1.8; color: #333; }
.modal-body .modal-content p { margin-bottom: 12px; }
.modal-body .modal-content img { max-width: 100%; border-radius: 8px; margin: 12px 0; }

.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin: 16px 0; }
.video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 8px; }

.file-download { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #1D1D1F; font-size: 14px; margin: 12px 0; transition: background 0.2s; }
.file-download:hover { background: #e8e8e8; }

.modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.modal-tags .tag { font-size: 11px; padding: 4px 12px; background: #f5f0e5; color: #C9A96E; border-radius: 12px; }

.empty { text-align: center; padding: 80px 20px; color: #999; font-size: 15px; }
.loading { text-align: center; padding: 80px 20px; color: #999; }

@media (max-width: 768px) {
  .case-grid { grid-template-columns: 1fr; }
  .page-header h1 { font-size: 28px; }
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="/cdn/logo.jpg" alt="青松设计"><span>青松设计</span></a>
    <ul class="nav-links">
      <li><a href="/#services">服务项目</a></li>
      <li><a href="/#process">设计流程</a></li>
      <li><a href="cases.html" class="active">设计案例</a></li>
      <li><a href="blog.html">最新博客</a></li>
      <li><a href="/#about">关于我们</a></li>
      <li><a href="/#contact" class="primary-link">预约咨询</a></li>
    </ul>
  </div>
</nav>

<div class="page-header">
  <h1>设计案例</h1>
  <div class="line"></div>
  <p>每一个项目，都是用心交付的作品</p>
</div>

<div class="container">
  <div class="case-grid" id="caseGrid">
    <div class="loading">加载中...</div>
  </div>
</div>



<script>
// 加载案例列表
async function loadCases() {
  const grid = document.getElementById('caseGrid');
  try {
    const res = await fetch('/api/cases?limit=50');
    const cases = await res.json();

    if (!Array.isArray(cases) || cases.length === 0) {
      grid.innerHTML = '<div class="empty">暂无案例展示，敬请期待</div>';
      return;
    }

    grid.innerHTML = cases.map(c => {
      const hasVideo = !!c.video_url;
      const hasFile = !!c.file_url;
      const tags = c.tags ? c.tags.split(',').filter(t => t.trim()) : [];
      const coverSrc = c.cover_image || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22360%22 height=%22220%22><rect fill=%22%23e0e0e0%22 width=%22360%22 height=%22220%22/><text x=%22180%22 y=%22110%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2216%22>暂无封面</text></svg>';

      return `
        <a href="case.html?id=${c.id}" class="case-card">
          <div class="case-card-img">
            <img src="${coverSrc}" alt="${c.title}" loading="lazy" onerror="this.parentElement.style.background='%23f5f5f5';this.style.display='none';">
            ${hasVideo || hasFile ? `<div class="case-card-badges">
              ${hasVideo ? '<span class="case-card-badge badge-video">视频</span>' : ''}
              ${hasFile ? '<span class="case-card-badge badge-file">附件</span>' : ''}
            </div>` : ''}
          </div>
          <div class="case-card-body">
            <h3>${c.title}</h3>
            ${c.description ? `<p>${c.description}</p>` : ''}
            ${tags.length > 0 ? `<div class="case-card-tags">${tags.map(t => `<span class="tag">${t.trim()}</span>`).join('')}</div>` : ''}
          </div>
        </a>`;
    }).join('');
  } catch (e) {
    grid.innerHTML = '<div class="empty">加载失败，请刷新页面重试</div>';
  }
}





loadCases();
</script>
</body>
</html>
