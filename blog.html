<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最新博客 - 青松设计 | SketchUp教程</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color:#1D1D1F; background:#FBFBFB; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.nav { position:fixed; top:0; left:0; right:0; z-index:1000; padding:0 40px; height:52px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.72); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid rgba(0,0,0,0.08); }
.nav-inner { width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; }
.nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
.nav-logo img { width:32px; height:32px; border-radius:50%; border:2px solid #C9A96E; object-fit:cover; }
.nav-logo-text { font-size:18px; font-weight:600; color:#1D1D1F; letter-spacing:1px; }
.nav-links { display:flex; gap:28px; list-style:none; align-items:center; }
.nav-links a { text-decoration:none; color:#1D1D1F; font-size:14px; font-weight:400; transition:color 0.25s; }
.nav-links a:hover, .nav-links a.active { color:#C9A96E; }
.page-header { padding:100px 20px 40px; text-align:center; background:#fff; }
.page-header h1 { font-size:36px; font-weight:700; letter-spacing:2px; }
.page-header .line { width:50px; height:3px; background:#C9A96E; margin:16px auto 0; }
.page-header p { color:#666; margin-top:12px; font-size:15px; }
.container { max-width:1100px; margin:0 auto; padding:0 20px; }

.search-bar { display:flex; justify-content:center; padding:20px 0 8px; }
.search-bar input { width:100%; max-width:500px; padding:10px 18px; border:1px solid #ddd; border-radius:24px; font-size:14px; outline:none; background:#fff; transition:border-color 0.25s, box-shadow 0.25s; }
.search-bar input:focus { border-color:#C9A96E; box-shadow:0 0 0 3px rgba(201,169,110,0.15); }
.search-bar input::placeholder { color:#bbb; }
.search-result-count { text-align:center; font-size:13px; color:#999; padding:4px 0 8px; min-height:22px; }

.filter-bar { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding:16px 0 24px; }
.filter-bar button { border:1px solid #ddd; background:#fff; padding:6px 18px; border-radius:20px; cursor:pointer; font-size:13px; color:#555; transition:all 0.2s; }
.filter-bar button.active, .filter-bar button:hover { background:#C9A96E; color:#fff; border-color:#C9A96E; }

.blog-list { display:grid; grid-template-columns:repeat(4, 1fr); gap:24px; padding-bottom:60px; }
.blog-item { display:flex; flex-direction:column; border-radius:8px; overflow:hidden; background:#fff; border:1px solid #f0f0f0; cursor:pointer; transition:transform 0.2s; text-decoration:none; color:inherit; }
.blog-item:hover { transform:translateY(-4px); }
.blog-item .thumb { height:180px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.blog-item .thumb img { width:100%; height:100%; object-fit:cover; }
.blog-item .thumb .no-img { color:#ccc; font-size:36px; }
.blog-item .info { padding:16px; flex:1; display:flex; flex-direction:column; }
.blog-item .info h3 { font-size:15px; font-weight:600; margin-bottom:6px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.blog-item .info .excerpt { font-size:12px; color:#999; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.blog-item .info .meta { margin-top:auto; font-size:11px; color:#bbb; display:flex; justify-content:space-between; }

.empty { text-align:center; padding:80px 20px; color:#999; }

@media (max-width:768px) {
  .blog-list { grid-template-columns:repeat(2, 1fr); gap:14px; }
  .blog-item .thumb { height:140px; }
  .page-header h1 { font-size:28px; }
  .nav { padding:0 16px; }
}
@media (max-width:480px) {
  .blog-list { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="/cdn/logo.jpg" alt="青松设计"><span class="nav-logo-text">青松设计</span></a>
    <ul class="nav-links">
      <li><a href="/#services">服务项目</a></li>
      <li><a href="/#process">设计流程</a></li>
      <li><a href="cases.html">设计案例</a></li>
      <li><a href="blog.html" class="active">最新博客</a></li>
      <li><a href="/#about">关于我们</a></li>
      <li><a href="/#contact">预约咨询</a></li>
    </ul>
  </div>
</nav>

<div class="page-header">
  <h1>最新博客</h1>
  <div class="line"></div>
  <p>设计灵感 · SketchUp教程 · 行业观察</p>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索文章...">
  </div>
  <div class="search-result-count" id="resultCount"></div>
  <div class="filter-bar" id="filterBar">
    <button class="active" data-cat="">全部</button>
    <button data-cat="SketchUp教程">SketchUp教程</button>
    <button data-cat="设计理念">设计理念</button>
    <button data-cat="行业资讯">行业资讯</button>
    <button data-cat="项目纪实">项目纪实</button>
    <button data-cat="装修百科">装修百科</button>
  </div>
  <div class="blog-list" id="blogList">
    <div class="empty">加载中...</div>
  </div>
</div>

<script>
let allPosts = [];
let currentCat = '';

async function loadPosts() {
  const list = document.getElementById('blogList');
  try {
    const res = await fetch('/api/blog?limit=100');
    const data = await res.json();
    allPosts = data.posts || [];
    renderPosts();
  } catch (e) {
    list.innerHTML = '<div class="empty">加载失败，请刷新页面重试</div>';
  }
}

function renderPosts() {
  const list = document.getElementById('blogList');
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();

  let filtered = allPosts;
  if (currentCat) {
    filtered = filtered.filter(p => p.category === currentCat);
  }
  if (searchTerm) {
    filtered = filtered.filter(p => {
      const tagsStr = Array.isArray(p.tags) ? p.tags.join(' ') : (p.tags || '');
      return p.title.toLowerCase().includes(searchTerm) ||
        (p.excerpt || '').toLowerCase().includes(searchTerm) ||
        (p.content || '').toLowerCase().includes(searchTerm) ||
        tagsStr.toLowerCase().includes(searchTerm);
    });
  }

  document.getElementById('resultCount').textContent = filtered.length > 0 ? `共 ${filtered.length} 篇文章` : '';

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">暂无匹配的文章</div>';
    return;
  }

  list.innerHTML = filtered.map(p => `
    <a class="blog-item" href="article.html?id=${p.id}">
      <div class="thumb">
        ${p.cover_image
          ? `<img src="${p.cover_image}" alt="${p.title}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=no-img>📷</span>'">`
          : '<span class="no-img">📷</span>'}
      </div>
      <div class="info">
        <h3>${p.title}</h3>
        ${p.excerpt ? `<p class="excerpt">${p.excerpt}</p>` : ''}
        <div class="meta">
          <span>📅 ${new Date(p.created_at).toLocaleDateString('zh-CN')}</span>
          ${p.category ? `<span>📂 ${p.category}</span>` : ''}
          <span>👁 ${p.views || 0}</span>
        </div>
      </div>
    </a>
  `).join('');
}

document.getElementById('filterBar').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') {
    document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentCat = e.target.dataset.cat;
    renderPosts();
  }
});

document.getElementById('searchInput').addEventListener('input', renderPosts);

loadPosts();
</script>
</body>
</html>
