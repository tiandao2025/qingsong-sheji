<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #1D1D1F; background: #FFFFFF; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* Navbar */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.95); border-bottom: 1px solid rgba(0,0,0,0.06); }
.nav-inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px; }
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #C9A96E; object-fit: cover; }
.nav-logo span { font-size: 16px; font-weight: 600; color: #1D1D1F; }
.nav-links { display: flex; align-items: center; gap: 6px; list-style: none; }
.nav-links a { text-decoration: none; color: #555; font-size: 13px; padding: 6px 14px; border-radius: 20px; transition: background 0.2s ease, color 0.2s ease; }
.nav-links a:hover, .nav-links a.active { background: #F5F5F7; color: #1D1D1F; }
.nav-links a.primary-link { background: #C9A96E; color: #fff; font-weight: 500; }
.nav-links a.primary-link:hover { background: #B8995E; }

/* Page Header */
.page-header { padding-top: 100px; padding-bottom: 48px; text-align: center; }
.page-header h1 { font-size: 40px; font-weight: 700; letter-spacing: 2px; }
.page-header .line { width: 50px; height: 3px; background: #C9A96E; margin: 16px auto 0; }
.page-header p { color: #666; margin-top: 12px; font-size: 15px; }

/* Games Grid */
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px; padding-bottom: 28px; }

.game-card {
  display: flex; flex-direction: column; background: #fff; border-radius: 12px; overflow: hidden;
  border: 1px solid #f0f0f0; text-decoration: none; color: inherit; cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.game-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }

.game-cover { position: relative; height: 180px; overflow: hidden; background: #101223; }
.game-cover svg { display: block; width: 100%; height: 100%; }
.game-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; background: #C9A96E; color: #fff; }
.game-play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 56px; height: 56px; border-radius: 50%; padding-left: 4px;
  background: rgba(10,14,34,0.55); border: 2px solid rgba(201,169,110,0.9); color: #C9A96E;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  transition: background 0.25s ease, color 0.25s ease;
}
.game-card:hover .game-play { background: rgba(201,169,110,0.92); color: #fff; }

.game-card-body { flex: 1; display: flex; flex-direction: column; padding: 20px; }
.game-card-body h3 { font-size: 17px; font-weight: 600; line-height: 1.4; }
.game-sub { font-size: 12px; color: #C9A96E; letter-spacing: 0.5px; margin-top: 2px; }
.game-desc { font-size: 13px; color: #888; line-height: 1.6; margin-top: 10px; }
.game-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.game-tags .tag { font-size: 11px; padding: 3px 10px; background: #f5f0e5; color: #C9A96E; border-radius: 12px; }
.game-meta { margin-top: 16px; padding-top: 14px; border-top: 1px solid #f2f2f2; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #aaa; }
.game-cta { color: #C9A96E; font-weight: 500; font-size: 13px; }

/* coming soon placeholder */
.game-card.soon { border-style: dashed; cursor: default; }
.game-card.soon:hover { transform: none; box-shadow: none; }
.soon-cover { display: flex; align-items: center; justify-content: center; background: #FAFAFA; }
.soon-cover .soon-plus { font-size: 38px; color: #DDD; line-height: 1; }
.game-card.soon h3 { color: #AAA; }

.grid-note { text-align: center; font-size: 12px; color: #BBB; padding-bottom: 80px; }

@media (max-width: 768px) {
  .game-grid { grid-template-columns: 1fr; gap: 20px; }
  .game-cover { height: 150px; }
  .page-header h1 { font-size: 28px; }
  .nav { padding: 0 16px; }
}
</style>
</head>
