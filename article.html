<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 - 青松设计</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color:#1D1D1F; background:#FBFBFB; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.nav { position:fixed; top:0; left:0; right:0; z-index:1000; padding:0 40px; height:52px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.72); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid rgba(0,0,0,0.08); }
.nav-inner { width:100%; max-width:1100px; display:flex; align-items:center; justify-content:space-between; }
.nav-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
.nav-logo img { width:32px; height:32px; border-radius:50%; border:2px solid #C9A96E; object-fit:cover; }
.nav-logo-text { font-size:18px; font-weight:600; color:#1D1D1F; letter-spacing:1px; }
.nav-links { display:flex; gap:28px; list-style:none; align-items:center; }
.nav-links a { text-decoration:none; color:#1D1D1F; font-size:14px; font-weight:400; transition:color 0.25s; }
.nav-links a:hover, .nav-links a.active { color:#C9A96E; }

.back-link { padding:100px 20px 0; text-align:center; }
.back-link a { color:#999; font-size:13px; text-decoration:none; }
.back-link a:hover { color:#C9A96E; }

.article-container { max-width:800px; margin:0 auto; padding:20px 20px 60px; }
.loading { text-align:center; padding:60px; color:#999; }
.error { text-align:center; padding:60px; color:#e74c3c; }

.cover-image { width:100%; max-height:400px; object-fit:cover; border-radius:8px; margin-bottom:32px; }
.article-title { font-size:28px; font-weight:700; margin-bottom:12px; line-height:1.4; }
.article-meta { color:#999; font-size:13px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid #eee; }
.article-content { font-size:15px; line-height:1.9; color:#333; }
.article-content p { margin-bottom:14px; }
.article-content img { max-width:100%; border-radius:8px; margin:12px 0; }
.article-content h2 { font-size:20px; margin-top:24px; margin-bottom:12px; }
.article-content h3 { font-size:17px; margin-top:20px; margin-bottom:10px; }
.article-content iframe { max-width:100%; border-radius:8px; margin:12px 0; }
.article-content a { color:#C9A96E; }
.article-content ul, .article-content ol { padding-left:24px; margin-bottom:14px; }
.article-content li { margin-bottom:6px; }
.article-content blockquote { border-left:3px solid #C9A96E; padding-left:16px; color:#666; margin:16px 0; }
.article-content pre { background:#0d1117; color:#e6edf3; padding:16px 56px 16px 16px; border-radius:8px; overflow-x:auto; margin:14px 0; font-family:Consolas, "Courier New", "SF Mono", Menlo, monospace; font-size:13px; line-height:1.7; }
.article-content code { font-size:13px; font-family:Consolas, "Courier New", "SF Mono", Menlo, monospace; }
.code-block-wrap { position:relative; background:#0d1117; border-radius:8px; margin:14px 0; }
.code-block-wrap pre { margin:0; background:transparent; }
.copy-btn { position:absolute; top:8px; right:8px; z-index:2; background:rgba(255,255,255,0.12); color:#e6edf3; border:1px solid rgba(255,255,255,0.16); border-radius:6px; padding:3px 10px; font-size:12px; line-height:1.5; cursor:pointer; font-family:inherit; transition:background 0.2s, color 0.2s; }
.copy-btn:hover { background:rgba(255,255,255,0.25); color:#fff; }
.copy-btn.copied { background:#238636; border-color:#238636; color:#fff; }

/* 付费下载（方案A：扫码+自助领取） */
.downloads-section { margin-top:36px; padding-top:24px; border-top:1px solid #eee; }
.downloads-section h2 { font-size:20px; margin-bottom:16px; color:#1D1D1F; }
.dl-card { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid #eee; border-radius:12px; padding:16px 18px; margin-bottom:12px; transition:box-shadow 0.2s; }
.dl-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.06); }
.dl-card-info { flex:1; min-width:0; }
.dl-card-name { font-size:16px; font-weight:600; color:#1D1D1F; margin-bottom:4px; }

.pay-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:10000; display:none; align-items:center; justify-content:center; padding:20px; }
.pay-overlay.show { display:flex; }

.pay-modal h3 { font-size:18px; margin-bottom:8px; color:#1D1D1F; }

<div class="back-link">
  <a href="blog.html">&larr; 返回博客列表</a>

<div class="article-container" id="articleContainer">
  <div class="loading">加载中...</div>

<script src="/js/marked.min.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');
if (!id) {
  document.getElementById('articleContainer').innerHTML = '<div class="error">缺少文章 ID</div>';
} else {
  loadArticle(id);
}

async function loadArticle(id) {
  const container = document.getElementById('articleContainer');
  try {
    const res = await fetch(`/api/blog/${id}`);
    if (!res.ok) throw new Error('加载失败');
    const p = await res.json();
    document.title = p.title + ' - 青松设计';
    payDownloads = p.downloads || [];
    container.innerHTML = `
      ${p.cover_image ? `<img class="cover-image" src="${p.cover_image}" alt="${p.title}" onerror="this.style.display='none'">` : ''}
      <h1 class="article-title">${p.title}</h1>
      <div class="article-meta">
        📅 ${new Date(p.created_at).toLocaleDateString('zh-CN')}
        ${p.category ? ` · 📂 ${p.category}` : ''}
      </div>
      ${p.bilibili ? `<div class="article-bilibili" style="margin:20px 0;"><div style="position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;"><iframe src="${p.bilibili.match(/src="([^"]+)"/)?.[1] || p.bilibili}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allowfullscreen scrolling="no"></iframe></div></div>` : ''}
      <div class="article-content">${formatContent(p.content)}</div>
      ${renderDownloads(p.downloads)}
    `;
    enhanceCodeBlocks();
  } catch (e) {
    container.innerHTML = '<div class="error">加载失败，请返回列表重试</div>';
  }
}

// 付费下载区域：展示下载项卡片，点击弹出收款弹窗
function renderDownloads(downloads) {
  if (!downloads || !downloads.length) return '';
  const sorted = downloads.slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const cards = sorted.map((d, i) => {
    const name = (d.name || ('下载项 ' + (i + 1)));
    const price = parseFloat(d.price) || 0;
    const desc = d.description || '';
    const priceHtml = price > 0
      ? '<span class="dl-card-price">¥' + price.toFixed(2) + '</span>'
      : '<span class="dl-card-price free">免费</span>';
    return '<div class="dl-card">' +
      '<div class="dl-card-info"><div class="dl-card-name">' + escapeHtml(name) + '</div>' +
      (desc ? '<div class="dl-card-desc">' + escapeHtml(desc) + '</div>' : '') +
      '</div>' + priceHtml +
      '<button type="button" class="dl-card-btn" data-idx="' + i + '" onclick="openPayModal(' + i + ')">立即下载</button>' +
      '</div>';
  }).join('');
  return '<div class="downloads-section"><h2>资料下载</h2>' + cards + '</div>';
}

let payDownloads = [];

function openPayModal(idx) {
  const dl = payDownloads[idx];
  if (!dl) return;
  const price = parseFloat(dl.price) || 0;
  const modal = document.getElementById('payModal');
  document.getElementById('payTitle').textContent = dl.name || '下载资料';
  const priceEl = document.getElementById('payPrice');
  if (price > 0) {
    priceEl.textContent = '¥' + price.toFixed(2);
    priceEl.classList.remove('free');
  } else {
    priceEl.textContent = '免费';
    priceEl.classList.add('free');
  }
  const qrEl = document.getElementById('payQr');
  const claimEl = document.getElementById('payClaim');
  claimEl.classList.remove('show');
  const linkEl = document.getElementById('payDlLink');
  if (dl.file_url) {
    linkEl.href = dl.file_url;
    linkEl.textContent = '点击下载' + (dl.file_url.split('/').pop() ? '：' + dl.file_url.split('/').pop() : '');
  }
  if (dl.qr_image && price > 0) {
    qrEl.src = dl.qr_image;
    qrEl.style.display = 'block';
    document.getElementById('payDesc').textContent = dl.description || '请先扫码支付，付款后点击下方按钮领取下载链接';
    document.getElementById('payBtn').style.display = 'block';
  } else {
    qrEl.style.display = 'none';
    document.getElementById('payDesc').textContent = dl.description || '免费资料，直接点击下载';
    document.getElementById('payBtn').style.display = 'none';
    claimEl.classList.add('show');
  }
  modal.classList.add('show');
}

function claimDownload() {
  document.getElementById('payClaim').classList.add('show');
}

function closePayModal() {
  document.getElementById('payModal').classList.remove('show');
  document.getElementById('payClaim').classList.remove('show');
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function trimUrlTail(url) {
  // 剥除 URL 尾部常见的句子标点（. , ; : ! ?），但保留 .zip/.pdf 等扩展名结尾
  var m = url.match(/^(.*?)[.,;:!?]+$/);
  if (m && m[1] && m[1].length > 8 && !/\.(zip|pdf|docx?|xlsx?|pptx?|rar|7z|tar|gz|mp4|mp3|png|jpe?g|gif|webp|svg|exe|apk|html?)$/i.test(url)) {
    return m[1];
  }
  return url;
}

function escapeHtmlAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function markdownLinkify(md) {
  // 渲染前将 Markdown 正文中的裸 URL 转为 Markdown 链接格式 [url](url)，
  // 保护：代码块/行内代码、已有 Markdown 链接语法不被破坏
  var guards = [];
  md = md.replace(/(```[\s\S]*?```|`[^`\n]+`)/g, function(m) { guards.push(m); return '\u0001G' + (guards.length - 1) + '\u0001'; });
  md = md.replace(/\[[^\]]*\]\([^)]*\)/g, function(m) { guards.push(m); return '\u0001G' + (guards.length - 1) + '\u0001'; });
  md = md.replace(/(https?:\/\/[^\s<>"'，。；、）】」》！？…]+)|((?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}(?:\/[^\s<>"'，。；、：）】」》！？…]*)?)/g, function(m, prot, bare) {
    var u = trimUrlTail(m);
    var safe = u.replace(/\)/g, '%29');
    if (bare) safe = 'https://' + safe;
    if (u.length !== m.length) return '[' + safe + '](' + safe + ')' + m.slice(u.length);
    return '[' + safe + '](' + safe + ')';
  });
  md = md.replace(/\u0001G(\d+)\u0001/g, function(_, i) { return guards[+i]; });
  return md;
}

function linkifyTextUrls(str) {
  // HTML 正文（旧文章）中的纯文本 URL 转 <a> 标签，保护代码块与标签属性
  var guards = [];
  str = str.replace(/<pre[\s\S]*?<\/pre>/gi, function(m) { guards.push(m); return '\u0001G' + (guards.length - 1) + '\u0001'; });
  str = str.replace(/<code[\s\S]*?<\/code>/gi, function(m) { guards.push(m); return '\u0001G' + (guards.length - 1) + '\u0001'; });
  str = str.replace(/<[^>]+>/g, function(m) { guards.push(m); return '\u0001G' + (guards.length - 1) + '\u0001'; });
  str = str.replace(/(https?:\/\/[^\s<>"'，。；、）】」》！？…]+)|((?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}(?:\/[^\s<>"'，。；、：）】」》！？…]*)?)/g, function(m, prot, bare) {
    var u = trimUrlTail(m);
    var href = escapeHtmlAttr(bare ? 'https://' + u : u);
    if (u.length !== m.length) return '<a href="' + href + '" target="_blank" rel="noopener">' + href + '</a>' + m.slice(u.length);
    return '<a href="' + href + '" target="_blank" rel="noopener">' + href + '</a>';
  });
  str = str.replace(/\u0001G(\d+)\u0001/g, function(_, i) { return guards[+i]; });
  return str;
}

function formatContent(html) {
  if (!html) return '';
  // 旧文章正文直接存 HTML（含 <h3>/<iframe>/<div> 等标签）→ 原样展示；
  // 新文章正文是 Markdown → 先渲染成 HTML
  if (!/<[a-zA-Z!][^>]*>/.test(html) && typeof marked !== 'undefined') {
    // breaks:true —— 单个换行也渲染为 <br>，保证从别处复制粘贴的多行文本换行可识别、可保留
    try { html = marked.parse(markdownLinkify(html), { breaks: true, gfm: true }); } catch (e) {}
  } else {
    html = linkifyTextUrls(html);
  }
  html = html.replace(/\/api\/image\?key=([^"&\s]+)/g, function(_, key) {
    return '/cdn/' + decodeURIComponent(key);
  });
  // 所有外部 <a>（含 marked 渲染的 Markdown 链接）统一补 target=_blank + rel=noopener
  html = html.replace(/<a\b(?![^>]*\btarget=)([^>]*\bhref="https?:\/\/[^"]*"[^>]*)>/g, '<a$1 target="_blank" rel="noopener">');
  return html
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/\s+on\w+\s*=\s*"[^"]*"/gi, '')
    .replace(/\s+on\w+\s*=\s*'[^']*'/gi, '')
    .replace(/href\s*=\s*"javascript:[^"]*"/gi, 'href="#"');
}

function enhanceCodeBlocks() {
  const preList = document.querySelectorAll('.article-content pre');
  preList.forEach(function(pre) {
    if (pre.parentElement && pre.parentElement.classList.contains('code-block-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'code-block-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.textContent = '复制';
    btn.setAttribute('aria-label', '复制代码');
    wrap.appendChild(btn);
    btn.addEventListener('click', function() {
      const text = pre.innerText || pre.textContent || '';
      function markCopied() {
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = '复制';
          btn.classList.remove('copied');
        }, 1500);
      }
      function fallbackCopy(str) {
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(markCopied).catch(function() {
          fallbackCopy(text);
          markCopied();
        });
      } else {
        fallbackCopy(text);
        markCopied();
      }
    });
  });
}
</script>

<div class="chat-widget-btn" id="chatBtn" title="在线咨询">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>

<div class="chat-widget-panel" id="chatPanel">
  <div class="chat-widget-header">
    <div class="avatar"><img src="/cdn/logo.jpg" alt="赛赛" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"></div>
    <div class="info">
      <div class="name">赛赛 · 在线客服</div>
      <div class="sub">青松空间设计</div>
    </div>
    <button class="chat-widget-close" id="chatClose">&times;</button>
  </div>
  <div class="chat-widget-body" id="chatBody">
    <div class="msg assistant">您好!我是青松设计的赛赛~ 请问有什么可以帮您的?</div>
  </div>
  <div class="chat-widget-input-area">
    <input type="text" id="chatInput" placeholder="输入您的问题..." />
    <button id="chatSend">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  var sessionId = 'web-' + Date.now();
  var messages = [];
  var btn = document.getElementById('chatBtn');
  var panel = document.getElementById('chatPanel');
  var close = document.getElementById('chatClose');
  var body = document.getElementById('chatBody');
  var input = document.getElementById('chatInput');
  var sendBtn = document.getElementById('chatSend');

  function togglePanel() {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) input.focus();
  }
  btn.addEventListener('click', togglePanel);
  close.addEventListener('click', function(){
    panel.classList.remove('open');
    sendChatLog();
  });

  function addMsg(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
  }

  function showTyping() {
    var div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.textContent = '赛赛正在输入...';
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
  }

  function hideTyping() {
    var el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMsg() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMsg('user', text);
    messages.push({ role: 'user', content: text });
    showTyping();

    try {
      var resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages, sessionId: sessionId, blogId: id })
      });
      var data = await resp.json();
      hideTyping();
      var reply = data.reply || '抱歉,暂时无法回复,请拨打19907444111咨询~';
      addMsg('assistant', reply);
      messages.push({ role: 'assistant', content: reply });
    } catch(e) {
      hideTyping();
      addMsg('assistant', '网络出小差了,请稍后再试或拨打19907444111直接咨询~');
    }
  }

  sendBtn.addEventListener('click', sendMsg);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMsg();
  });

  var logSent = false;
  async function sendChatLog() {
    if (logSent || messages.length === 0) return;
    logSent = true;
    try {
      await fetch('/api/chat/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId, messages: messages })
      });
    } catch(e) {}
  }

  window.addEventListener('beforeunload', function() {
    if (!logSent && messages.length > 0) {
      try {
        navigator.sendBeacon('/api/chat/log', JSON.stringify({ sessionId: sessionId, messages: messages }));
      } catch(e) {}
    }
  });

})();
</script>

</body>
