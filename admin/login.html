<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台登录 - 青松设计</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #1D1D1F;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; color: #fff;
}
.login-box {
  background: #2C2C2E;
  border-radius: 16px;
  padding: 48px 40px;
  width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.login-box h1 {
  text-align: center; font-size: 24px; font-weight: 600;
  margin-bottom: 8px; color: #C9A96E;
}
.login-box p {
  text-align: center; font-size: 13px; color: #888;
  margin-bottom: 32px;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 13px; color: #aaa;
  margin-bottom: 6px; font-weight: 500;
}
.form-group input {
  width: 100%; padding: 12px 16px;
  border: 1px solid #444; border-radius: 8px;
  background: #1C1C1E; color: #fff;
  font-size: 15px; outline: none;
  transition: border-color 0.25s;
}
.form-group input:focus {
  border-color: #C9A96E;
}
.btn {
  width: 100%; padding: 12px;
  background: #C9A96E; color: #fff;
  border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600;
  cursor: pointer; transition: background 0.25s;
}
.btn:hover { background: #B8995E; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.error-msg {
  color: #ff4d4d; font-size: 13px;
  text-align: center; margin-top: 16px;
  min-height: 20px;
}
</style>
</head>
<body>
<div class="login-box">
  <h1>青松设计</h1>
  <p>CMS 管理后台</p>
  <p style="text-align:center; color:#aaa; margin:24px 0;">正在进入后台...</p>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// 免密登录：页面加载自动获取 token 并进入后台
(async () => {
  const errorEl = document.getElementById('errorMsg');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem('qs_token', data.token);
      window.location.href = '/admin/dashboard.html';
    } else {
      errorEl.textContent = data.error || '登录失败';
    }
  } catch (err) {
    errorEl.textContent = '网络错误，请重试';
  }
})();
</script>
</body>
</html>
